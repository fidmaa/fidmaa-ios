<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Porównanie głębi 3D</title>
<style>
:root{--bg:#111;--fg:#eee;--muted:#aaa;--panel:rgba(0,0,0,.6)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px -apple-system,system-ui,sans-serif;overflow:hidden}
canvas{display:block}
.label{position:absolute;top:10px;padding:6px 9px;background:var(--panel);border-radius:6px;line-height:1.4}
.label small{color:var(--muted)}
.divider{position:absolute;top:0;bottom:0;width:1px;background:#444}
#bar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px;background:var(--panel);border-radius:8px;max-width:calc(100% - 32px)}
button{background:#333;color:var(--fg);border:1px solid #555;border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
button.on{background:#2d6cdf;border-color:#2d6cdf}
#measurements{position:absolute;top:10px;right:10px;max-width:340px;padding:8px 10px;background:var(--panel);border-radius:8px;display:none;line-height:1.5}
#measurements b{font-variant-numeric:tabular-nums}
#measurements small{color:var(--muted)}
body.measuring canvas{cursor:crosshair}
#hint{position:absolute;bottom:108px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:12px;text-align:center}
</style></head><body>
<div id="labels"></div>
<div id="measurements"></div>
<div id="hint">przeciągnij: obrót · scroll: zoom · prawy przycisk: przesuwanie — widoki są zsynchronizowane</div>
<div id="bar">
 <button data-mode="shade" class="on">Cieniowanie</button>
 <button data-mode="depth">Kolor = głębia</button>
 <button data-mode="std">Kolor = szum między klatkami</button>
 <button data-mode="photo">Tekstura zdjęcia</button>
 <button id="rot">Obróć 90°</button>
 <button id="light">Światło z przodu</button>
 <button id="reset">Reset widoku</button>
 <button id="measure">📏 Pomiar</button>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const D = __DATA__;
const Q = new URLSearchParams(location.hash.slice(1));
const f32 = b64 => { const s = atob(b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return new Float32Array(u.buffer); };
const W = D.cw, H = D.ch, P = D.panels.length;
const COLS = P <= 3 ? P : (P === 4 ? 2 : 3), ROWS = Math.ceil(P / COLS);
document.title = `Głębia 3D — ${D.title}`;
const texture = new THREE.TextureLoader().load(D.texture); texture.flipY = false; texture.colorSpace = THREE.SRGBColorSpace;
const depths = D.panels.map(p => f32(p.depth)), stdMap = D.std ? f32(D.std) : null;
if (!stdMap) document.querySelector('[data-mode=std]').remove();
function turbo(t){t=Math.min(1,Math.max(0,t));
 const r=0.13572138+t*(4.61539260+t*(-42.66032258+t*(132.13108234+t*(-152.94239396+t*59.28637943))));
 const g=0.09140261+t*(2.19418839+t*(4.84296658+t*(-14.18503333+t*(4.27729857+t*2.82956604))));
 const b=0.10667330+t*(12.64194608+t*(-60.58204836+t*(110.36276771+t*(-89.90310912+t*27.34824973))));
 return [r,g,b].map(v=>Math.min(1,Math.max(0,v)));}
let zmin = 1e9; for (const z of depths[0]) if (z > 0) zmin = Math.min(zmin, z);
function build(depth){
  const pos = new Float32Array(W*H*3), ok = new Uint8Array(W*H);
  for (let v=0; v<H; v++) for (let u=0; u<W; u++) { const i=v*W+u, z=depth[i]; if (!(z>0)) continue; ok[i]=1;
    pos[i*3]=(u+D.x0-D.cx)*z/D.fx; pos[i*3+1]=-(v+D.y0-D.cy)*z/D.fy; pos[i*3+2]=-z; }
  const idx = [], jump = 0.01;
  const good = (a,b,c) => ok[a]&&ok[b]&&ok[c] && Math.max(depth[a],depth[b],depth[c])-Math.min(depth[a],depth[b],depth[c]) < jump;
  for (let v=0; v<H-1; v++) for (let u=0; u<W-1; u++) { const a=v*W+u, b=a+1, c=a+W, d=c+1;
    if (good(a,c,b)) idx.push(a,c,b); if (good(b,c,d)) idx.push(b,c,d); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(W*H*3).fill(0.85),3));
  const uv = new Float32Array(W*H*2);  // depth pixel (u,v) ↔ same position in the stored photo
  for (let v=0; v<H; v++) for (let u=0; u<W; u++) { const i=v*W+u; uv[i*2]=(u+D.x0+0.5)/D.fullW; uv[i*2+1]=(v+D.y0+0.5)/D.fullH; }
  g.setAttribute('uv', new THREE.BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return {g, depth};
}
function colorize(m, mode){ const c = m.g.attributes.color.array;
  m.material.map = mode==='photo' ? texture : null; m.material.vertexColors = mode!=='photo'; m.material.needsUpdate = true;
  if (mode==='photo') return;
  for (let i=0; i<W*H; i++) { let rgb=[0.85,0.85,0.85];
    if (mode==='depth' && m.depth[i]>0) rgb = turbo(1-(m.depth[i]-zmin)/0.35);
    if (mode==='std' && stdMap) { const s=stdMap[i]; rgb = s>=0 ? turbo(s/0.003) : [0.3,0.3,0.3]; }
    c[i*3]=rgb[0]; c[i*3+1]=rgb[1]; c[i*3+2]=rgb[2]; }
  m.g.attributes.color.needsUpdate = true; }
const meshes = depths.map(build);
// orbit around the face: the image center, where the app measures distance
const p1 = meshes[0].g.attributes.position.array, xs=[], ys=[], zs=[];
const u0 = Math.round(D.fullW/2-D.x0), v0 = Math.round(D.fullH/2-D.y0);
for (let v=v0-30; v<=v0+30; v++) for (let u=u0-30; u<=u0+30; u++) { if (u<0||v<0||u>=W||v>=H) continue; const i=v*W+u;
  if (depths[0][i]>0) { xs.push(p1[i*3]); ys.push(p1[i*3+1]); zs.push(p1[i*3+2]); } }
const med = a => { a.sort((x,y)=>x-y); return a[a.length>>1]; };
const target = new THREE.Vector3(med(xs), med(ys), med(zs));
const renderer = new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(devicePixelRatio);
document.body.prepend(renderer.domElement); renderer.setScissorTest(true);
let rot = -Math.PI/2;
const scenes = meshes.map(m => { const s = new THREE.Scene(); s.background = new THREE.Color(0x111111);
  m.material = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.55, metalness:0, side:THREE.DoubleSide});
  const mesh = new THREE.Mesh(m.g, m.material);
  mesh.position.copy(target).negate(); const pivot = new THREE.Group(); pivot.add(mesh); pivot.rotation.z = rot; s.add(pivot);
  s.add(new THREE.AmbientLight(0xffffff, 0.35)); const dl = new THREE.DirectionalLight(0xffffff, 2.2); s.add(dl);
  return {s, pivot, dl, mesh}; });
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 10);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
function reset(){ camera.position.set(0,0,+(Q.get('dist')||0.5)); controls.target.set(0,0,0); controls.update(); }
reset();
let side = Q.get('light')==='side';
function placeLight(){ scenes.forEach(o => o.dl.position.set(side?0.6:0.1, side?0.25:0.1, side?0.25:1)); }
placeLight();
const labels = document.getElementById('labels');
function layout(){ renderer.setSize(innerWidth, innerHeight); camera.aspect = (innerWidth/COLS)/(innerHeight/ROWS); camera.updateProjectionMatrix();
  labels.innerHTML = D.panels.map((p,i) => `<div class="label" style="left:calc(${(i%COLS)*100/COLS}% + 10px);top:calc(${Math.floor(i/COLS)*100/ROWS}% + 10px)">${p.title}<br><small>chropowatość ${p.rough.toFixed(2)} mm${p.note?'<br>'+p.note:''}${p.title.includes('bilateral')?'<br>'+D.filter:''}${p.title.endsWith('mediana')&&D.stdMedianMm!=null?'<br>szum między klatkami '+D.stdMedianMm.toFixed(2)+' mm':''}</small></div>`).join('')
    + [...Array(COLS-1)].map((_,i)=>`<div class="divider" style="left:${(i+1)*100/COLS}%"></div>`).join('')
    + [...Array(ROWS-1)].map((_,i)=>`<div class="divider" style="top:${(i+1)*100/ROWS}%;bottom:auto;left:0;right:0;width:auto;height:1px"></div>`).join(''); }
addEventListener('resize', layout); layout();
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-mode]').forEach(x => x.classList.remove('on')); b.classList.add('on');
  meshes.forEach(m => colorize(m, b.dataset.mode)); });
document.getElementById('rot').onclick = () => { rot += Math.PI/2; scenes.forEach(o => o.pivot.rotation.z = rot); };
const lightBtn = document.getElementById('light');
const lightLabel = () => lightBtn.textContent = side ? 'Światło z boku' : 'Światło z przodu';
lightLabel(); lightBtn.onclick = () => { side = !side; lightLabel(); placeLight(); };
document.getElementById('reset').onclick = reset;
// ---- measuring: click two points on a model, get their 3D distance (model units are meters) ----
const measureBtn = document.getElementById('measure'), list = document.getElementById('measurements');
let measuring = false, pending = null, down = null, count = 0;
const results = [], markers = [];
measureBtn.onclick = () => { measuring = !measuring; measureBtn.classList.toggle('on', measuring);
  document.body.classList.toggle('measuring', measuring); pending = null; render(); };
function render(){
  list.style.display = measuring || results.length ? 'block' : 'none';
  list.innerHTML = (measuring ? `<small>${pending ? 'kliknij drugi punkt' : 'kliknij pierwszy punkt na modelu'}</small><br>` : '')
    + results.map(r => `${r.n}. <b>${r.mm.toFixed(1)} mm</b> <small>${r.panel}<br>`
      + `w poprzek ${r.lateral.toFixed(1)} mm · różnica głębi ${r.dz.toFixed(1)} mm</small>`).join('<br>')
    + (results.length ? '<br><button id="clear">Wyczyść pomiary</button>' : '');
  const clear = document.getElementById('clear');
  if (clear) clear.onclick = () => { markers.forEach(m => m.parent.remove(m)); markers.length = 0; results.length = 0; count = 0; render(); };
}
function marker(mesh, p){ const m = new THREE.Mesh(new THREE.SphereGeometry(0.0015, 12, 8),
    new THREE.MeshBasicMaterial({color: 0xff3355, depthTest: false}));
  m.position.copy(p); m.renderOrder = 10; mesh.add(m); markers.push(m); }
const raycaster = new THREE.Raycaster();
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!measuring || e.button !== 0 || !down || Math.hypot(e.clientX-down[0], e.clientY-down[1]) > 4) return;
  const w = innerWidth/COLS, h = innerHeight/ROWS, col = Math.floor(e.clientX/w), row = Math.floor(e.clientY/h), i = row*COLS+col;
  if (i >= P) return;
  const ndc = new THREE.Vector2(((e.clientX-col*w)/w)*2-1, -((e.clientY-row*h)/h)*2+1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObject(scenes[i].mesh, false)[0];
  if (!hit) return;
  const p = scenes[i].mesh.worldToLocal(hit.point.clone());  // camera coordinates of the TrueDepth sensor, meters
  marker(scenes[i].mesh, p);
  if (!pending || pending.panel !== i) { pending = {panel: i, p}; render(); return; }
  const a = pending.p, geo = new THREE.BufferGeometry().setFromPoints([a, p]);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({color: 0xff3355, depthTest: false}));
  line.renderOrder = 10; scenes[i].mesh.add(line); markers.push(line);
  results.push({n: ++count, panel: D.panels[i].title, mm: a.distanceTo(p)*1000,
                lateral: Math.hypot(a.x-p.x, a.y-p.y)*1000, dz: Math.abs(a.z-p.z)*1000});
  pending = null; render();
});
if (Q.get('mode')) document.querySelector(`[data-mode=${Q.get('mode')}]`).click();
(function loop(){ requestAnimationFrame(loop); controls.update(); const w = innerWidth/COLS, h = innerHeight/ROWS;
  scenes.forEach((o,i) => { const x=(i%COLS)*w, y=(ROWS-1-Math.floor(i/COLS))*h;
    renderer.setViewport(x,y,w,h); renderer.setScissor(x,y,w,h); renderer.render(o.s, camera); }); })();
</script></body></html>
